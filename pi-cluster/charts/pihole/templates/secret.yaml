{{- $password := randAlphaNum 24 }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "pihole-admin" }}
{{- if and $existing (hasKey ($existing.data | default dict) "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: pihole-admin
  labels:
    app: pihole
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
