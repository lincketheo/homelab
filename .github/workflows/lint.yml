name: lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: ansible-lint
        working-directory: pi-cluster/ansible
        run: ansible-lint

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint pi-cluster/charts/pihole

      - name: helm template
        run: helm template pihole pi-cluster/charts/pihole >/dev/null
