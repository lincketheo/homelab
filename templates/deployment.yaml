apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pihole.fullname" . }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pihole.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pihole.selectorLabels" . | nindent 8 }}
      {{- if or (not .Values.admin.existingSecret) .Values.podAnnotations }}
      annotations:
        {{- if not .Values.admin.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      containers:
        - name: pihole
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: FTLCONF_dns_listeningMode
              value: "all"
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: {{ include "pihole.secretName" . }}
                  key: {{ .Values.admin.passwordKey }}
            {{- with .Values.upstreamDns }}
            - name: FTLCONF_dns_upstreams
              value: {{ join ";" . | quote }}
            {{- end }}
            {{- with .Values.localDnsRecords }}
            - name: FTLCONF_dns_hosts
              value: {{ include "pihole.dnsHosts" . | quote }}
            {{- end }}
            {{- range $key, $value := .Values.ftlconf }}
            - name: FTLCONF_{{ $key }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: dns-tcp
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /admin/
              port: http
            periodSeconds: 10
            failureThreshold: 3
          {{- with .Values.capabilities.add }}
          securityContext:
            capabilities:
              add:
                {{- toYaml . | nindent 16 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /etc/pihole
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pihole.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
