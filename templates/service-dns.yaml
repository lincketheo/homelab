apiVersion: v1
kind: Service
metadata:
  name: {{ include "pihole.fullname" . }}-dns
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
  {{- with .Values.dns.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.dns.service.type }}
  {{- if and (has .Values.dns.service.type (list "LoadBalancer" "NodePort")) .Values.dns.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.dns.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "pihole.selectorLabels" . | nindent 4 }}
  ports:
    - name: dns-udp
      port: {{ .Values.dns.service.port }}
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: {{ .Values.dns.service.port }}
      targetPort: dns-tcp
      protocol: TCP
