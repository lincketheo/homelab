image:
  repository: pihole/pihole
  tag: ""              # set to a dated release, e.g. "2025.08.0"
  pullPolicy: IfNotPresent

admin:
  existingSecret: ""   # name of a Secret you create yourself
  passwordKey: password
  password: ""

timezone: America/New_York

upstreamDns:
  - 1.1.1.1
  - 1.0.0.1

localDnsRecords: []
  # - ip: 192.168.0.110
  #   host: raspi.lan

ftlconf: {}
extraEnv: []

dns:
  service:
    type: LoadBalancer
    port: 53
    externalTrafficPolicy: Local
    annotations: {}

web:
  service:
    type: LoadBalancer
    port: 8080
    annotations: {}

ingress:
  enabled: false
  className: traefik
  host: pihole.lan
  annotations: {}
  tls: []

persistence:
  enabled: true
  existingClaim: ""
  storageClass: local-path
  size: 1Gi
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

capabilities:
  add: []

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
